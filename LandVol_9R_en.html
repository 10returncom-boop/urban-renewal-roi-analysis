<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#0f1419;--bg2:#1a2028;--bg3:#242c37;--line:#2e3845;--fg:#e8edf2;--fg2:#8b96a5;--accent:#d4a853;--accent2:#3da9fc;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--fg);font-size:14px;line-height:1.6;overflow-x:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;z-index:100;transition:transform .3s}
.sidebar.collapsed{transform:translateX(-260px)}
.main{margin-left:260px;transition:margin .3s;min-height:100vh}
.main.expanded{margin-left:0}
@media(max-width:1100px){.sidebar{transform:translateX(-260px)}.sidebar.mobile-open{transform:translateX(0)}.main{margin-left:0}.footer{margin-left:0}}
.brand{padding:20px;border-bottom:1px solid var(--line)}
.brand h1{font-size:18px;color:var(--accent)}
.brand .ver{font-size:10px;color:var(--fg2);margin-top:4px}
.brand .badge{display:inline-block;font-size:10px;background:var(--err);color:#fff;padding:2px 8px;border-radius:4px;margin-top:6px}
.nav{padding:12px 0}
.nav-group{padding:8px 20px;font-size:11px;color:var(--fg2);margin-top:8px}
.nav-item{display:block;padding:10px 20px;color:var(--fg2);cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:var(--bg3);color:var(--fg)}
.nav-item.active{background:var(--bg3);color:var(--accent);border-left-color:var(--accent)}
.topbar{position:sticky;top:0;background:rgba(15,20,25,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;z-index:50}
.hamburger{background:none;border:none;color:var(--fg);font-size:20px;cursor:pointer}
.crumb{color:var(--fg2);font-size:13px}
.spacer{flex:1}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg3);color:var(--fg);cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn-accent{background:var(--accent);color:#1a1a1a;border:none;font-weight:700}
.content{padding:24px;max-width:1400px;margin:0 auto}
.hero{background:linear-gradient(135deg,#1a2028,#2a3548);border-radius:var(--radius);padding:32px;margin-bottom:24px;border:1px solid var(--line);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(212,168,83,.15),transparent 70%);border-radius:50%}
.hero h2{font-size:28px;color:var(--accent);margin-bottom:8px}
.hero p{color:var(--fg2)}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{font-size:15px;color:var(--accent);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px}
.field input{width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--fg)}
.field input:focus{outline:none;border-color:var(--accent)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{font-size:28px;font-weight:700;color:var(--accent)}
.kpi small{font-size:14px;color:var(--fg2);font-weight:400}
.kpi-label{font-size:11px;color:var(--fg2);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--accent);background:var(--bg3)}
#map9R{height:450px;border-radius:var(--radius);z-index:1;position:relative}
.toast{position:fixed;bottom:24px;right:24px;background:var(--accent);color:#1a1a1a;padding:12px 20px;border-radius:8px;font-weight:600;opacity:0;transition:opacity .3s;z-index:1000}
.toast.show{opacity:1}
.wm{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.wm span{position:absolute;color:rgba(255,255,255,.03);font-size:14px;white-space:nowrap;transform:rotate(-30deg)}
.footer{margin-left:260px;padding:24px;border-top:1px solid var(--line);color:var(--fg2);font-size:12px;display:flex;justify-content:space-between}
.muted{color:var(--fg2);font-size:12px}
.mt-2{margin-top:16px}
</style>
</head>

<script>
const C={PING:3.3058,CONSTR:10,EX_LOBBY:0.10,EX_BALCONY:0.05,EX_MACHINE:0.03};
const ZONE_DB=[
{z:'住1',bcr:.60,far:1.65,cap:2.64,note:'第一種Residential區 低密度'},
{z:'住1-1',bcr:.60,far:1.65,cap:2.64,note:'第一之一種Residential區'},
{z:'住1-2',bcr:.60,far:2.00,cap:3.20,note:'第一之二種Residential區'},
{z:'住2',bcr:.60,far:1.80,cap:2.88,note:'第二種Residential區'},
{z:'住2-1',bcr:.60,far:2.00,cap:3.20,note:'第二之一種Residential區'},
{z:'住3',bcr:.60,far:2.25,cap:3.60,note:'第三種Residential區 高層'},
{z:'住3-1',bcr:.60,far:3.00,cap:4.80,note:'第三之一種 捷運聯開'},
{z:'住4',bcr:.50,far:3.20,cap:5.12,note:'第四種Residential區 超高層'},
{z:'商1',bcr:.80,far:3.20,cap:4.16,note:'第一種商業區'},
{z:'商2',bcr:.80,far:4.00,cap:5.20,note:'第二種商業區'},
{z:'商3',bcr:.80,far:6.00,cap:7.80,note:'第三種商業區 百貨'},
{z:'商4',bcr:.80,far:8.00,cap:10.40,note:'第四種商業區 七期'},
{z:'工業區',bcr:.70,far:2.10,cap:2.31,note:'丁種建築 廠房'},
{z:'文教',bcr:.50,far:1.60,cap:1.76,note:'文教區'},
{z:'風景',bcr:.60,far:1.20,cap:1.32,note:'風景區'}];
let S={name:'',zone:'住1-1',areaPing:100,bcr:.60,far:1.65,farCap:2.64,roadWidth:25,
useTransfer:true,transferCap:.40,rewardOld:.06,rewardRetreat:.10,rewardScale:.08,
rewardSeismic:.04,rewardSmart:.06,rewardOpen:0,floorLayers:15,basementLayers:3,
unitPing:30,landPrice:100,housePrice:50,parkingPrice:200,announceValue:90000,
loanRatio:.5,loanRate:.02,loanYears:25,lat:24.1620,lng:120.6320};
function calc(){
const p=S.areaPing,gf=p*S.bcr*.965,lf=p*S.far;
const tf=S.useTransfer?lf*S.transferCap:0;
const rw=lf*(S.rewardOld+S.rewardRetreat+S.rewardScale+S.rewardSeismic+S.rewardSmart+S.rewardOpen);
let mf=lf+tf+rw;const cf=p*S.farCap;if(mf>cf)mf=cf;
const lb=mf*C.EX_LOBBY,bb=(mf+lb)*C.EX_BALCONY,mb=lf*1.6*C.EX_MACHINE;
const ag=mf+lb+bb+mb,park=Math.ceil(ag/150/150);
const bp=p*.84,bt=bp*S.basementLayers,bp2=Math.floor(bp/30)*S.basementLayers;
const pc=Math.max(park,bp2),tc=bt+ag+gf*.125*S.floorLayers*.6;
const sl=tc-pc*11,hu=Math.floor(sl/S.unitPing);
const hr=sl*S.housePrice,pr=pc*S.parkingPrice,rev=hr+pr;
const lc=p*S.landPrice,cc=tc*C.CONSTR;
const tcost=S.useTransfer?(p*C.PING*S.announceValue/10000*S.transferCap*2.2):0;
const tot=lc+cc+tcost+rev*.05,prof=rev-tot,roi=prof/tot;
const la=lc*S.loanRatio,mr=S.loanRate/12,n=S.loanYears*12;
const mp=la*mr*Math.pow(1+mr,n)/(Math.pow(1+mr,n)-1);
return{gf,lf,tf,rw,mf,cf,ag,pc,tc,sl,hu,rev,lc,cc,tcost,tot,prof,roi,la,mp};
}
function pct(v){return(v*100).toFixed(1)+'%'}
function w(v){return v.toFixed(1)}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}

{g:'📑 Advanced',items:[

{id:'matrix',name:'56 Sensitivity Matrix'},{id:'scenario',name:'57 Scenarios'},{id:'report',name:'58 Print Report'},{id:'checklist',name:'59 Checklist'},{id:'faq',name:'60 FAQ'}]}];
let curView='dashboard';

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed');document.getElementById('main').classList.toggle('expanded')}
function R_dashboard(R){return`<div class="hero"><h2>Land not bought? Regs calculated first.</h2><p>NLSC map, BCR, FAR, TDR incentives and ROI analysis. Real-time.</p></div>
<div class="grid grid-4">
<div class="card"><div class="kpi accent">${w(R.lf)}<small>坪</small></div><div class="kpi-label">Legal FAR</div></div>

case 'site':h=R_site(R);break;

default:
const L={dashboard:['01 Dashboard','Overview'],site:['02 Site Input','Site params'],zone:['03 Zoning DB','Lookup'],map:['04 NLSC Map','Interactive map'],road:['05 Road Access','Frontage'],landpv:['06 Land DCF','Discounted cash flow'],faro:['07 FAR Optimum','Best incentive combo'],bep:['08 Break-Even','Break-even point'],payback:['09 Payback Period','Payback years'],radar:['10 ROI Radar','Multi-dimensional radar'],bcr:['11 BCR Calc','Building coverage ratio'],far:['12 FAR Calc','Floor area ratio'],check13:['13 13-Point Check','Compliance checklist'],dig:['14 Excavation','Basement excavation'],height:['15 Height Limit','Height control'],setback:['16 Setback','Building line setback'],front:['17 Front/Rear Yard','Front/rear yard'],blin:['18 Building Line','Designated building line'],opencover:['19 Open Space Ratio','Open coverage'],sun:['20 Sunlight','Sunlight analysis'],eia:['21 EIA Check','Environmental impact'],reward:['22 Incentive Pack','All incentives'],transfer:['23 TDR','Transferable development rights'],danger:['24 Urgent Renewal','Urgent urban renewal act'],urban:['25 Urban Renewal','Urban renewal act'],green:['26 Green Building','EEWH certification'],smart:['27 Smart Building','Smart building'],urtdr:['28 URT TDR','URT TDR'],landscape:['29 Landscape','Landscape incentive'],disaster:['30 Disaster Resilience','Disaster design'],revenue:['31 Revenue','Residential + parking + retail'],cost:['32 Cost Breakdown','Land + construction + marketing'],fin:['33 Financing','Loan ratio / rate / monthly'],cashflow:['34 Cash Flow','Development cash flow'],irr:['35 IRR/NPV','Investment metrics'],sens:['36 Sensitivity','Price/cost ±10%'],marketing:['37 Marketing Fee','Advertising + management'],lvt:['38 Land VAT','Land value increment tax'],deedtax:['39 Deed Tax','Deed tax'],vat:['40 Business Tax','5% business tax'],margin:['41 Profit Margin','Gross margin'],unit:['42 Unit Mix','Unit composition'],park:['43 Parking','Legal parking count'],pub:['44 Common Area','Common area ratio'],floor:['45 Floor Config','Above/below floors'],shop:['46 Retail Floor','Ground-floor retail'],tower:['47 Tower Count','Single/double tower'],elev:['48 Elevators','Elevator count'],lobby:['49 Lobby','Lobby design'],balcony:['50 Balcony','Balcony design'],history:['51 History','localStorage records'],compare:['52 Compare','Multi-case comparison'],export:['53 Export','CSV export'],tax:['54 Tax','Land VAT + deed'],risk:['55 Risk Gauge','Risk indicators'],matrix:['56 Sensitivity Matrix','Two-factor matrix'],scenario:['57 Scenarios','Multiple scenarios'],report:['58 Print Report','Print'],checklist:['59 Checklist','Building permit checklist'],faq:['60 FAQ','Q&A'];

let map9R=null,mkr9R=null;
function initMap(){if(typeof L==='undefined')return;const el=document.getElementById('map9R');if(!el)return;
if(map9R){map9R.remove();map9R=null;mkr9R=null}
map9R=L.map(el).setView([S.lat,S.lng],16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(map9R);
try{L.tileLayer.wms('https://maps.nlsc.gov.tw/WMS/Query',{layers:'LANDSECT',format:'image/png',transparent:true}).addTo(map9R)}catch(e){}
mkr9R=L.marker([S.lat,S.lng]).addTo(map9R);
map9R.on('click',e=>{if(mkr9R)map9R.removeLayer(mkr9R);mkr9R=L.marker(e.latlng).addTo(map9R);S.lat=e.latlng.lat;S.lng=e.latlng.lng;const a=document.getElementById('mLat');if(a)a.textContent=S.lat.toFixed(5);const b=document.getElementById('mLng');if(b)b.textContent=S.lng.toFixed(5);toast('Site center: '+S.lat.toFixed(5)+', '+S.lng.toFixed(5))});
setTimeout(()=>map9R.invalidateSize(),200)}
function exportCSV(){const R=calc();const rows=[['項目','數值'],['Legal FAR(坪)',R.lf],['Max FAR(坪)',R.mf],['淨利(萬)',R.prof],['ROI',R.roi],['Parking數',R.pc],['收入(萬)',R.rev]];const csv=rows.map(r=>r.join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='9R_report.csv';a.click()}
function saveSnapshot(){localStorage.setItem('9R_snapshot',JSON.stringify(S));toast('已Save Scenario')}
